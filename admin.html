<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>snuz.ng – Product admin</title>
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="Private product admin for snuz.ng collections." />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" type="image/webp" href="./assets/snuz-logo.webp" />
    <link rel="icon" type="image/jpeg" href="./assets/snuz-logo.jpg" />
  </head>
  <body class="page-admin">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header is-solid" data-header>
      <div class="nav">
        <div class="container nav__inner">
          <a class="brand" href="./index.html" aria-label="snuz.ng home">
            <picture class="brand__mark" aria-hidden="true">
              <source srcset="./assets/snuz-logo.avif" type="image/avif" />
              <source srcset="./assets/snuz-logo.webp" type="image/webp" />
              <img class="brand__logo" src="./assets/snuz-logo.jpg" alt="" width="40" height="40" />
            </picture>
            <span class="brand__name">snuz.ng</span>
          </a>
          <div class="nav__cta">
            <a class="btn btn--ghost" href="./shop.html">View shop</a>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="admin">
      <div class="container admin__wrap admin__wrap--wide">
        <div class="admin__head">
          <p class="admin__eyebrow">Private</p>
          <h1 class="admin__title">Product admin</h1>
          <p class="admin__lede">
            Add each brand, then list its flavours, mg, and price. Shoppers pick those on the shop page.
          </p>
        </div>

        <section class="admin-card" id="admin-login" data-admin-login>
          <h2 class="admin-card__title">Sign in</h2>
          <p class="admin-card__hint">Enter the admin password to manage products.</p>
          <form class="admin-login" data-admin-login-form>
            <label class="admin-field">
              <span>Password</span>
              <input type="password" name="password" autocomplete="current-password" required />
            </label>
            <button class="btn btn--primary btn--block" type="submit">Unlock</button>
            <p class="admin-status" data-admin-login-status hidden></p>
          </form>
        </section>

        <section class="admin-card" id="admin-panel" data-admin-panel hidden>
          <div class="admin-panel__top">
            <div>
              <h2 class="admin-card__title">Our Collections</h2>
              <p class="admin-card__hint" data-admin-source>Loading products…</p>
            </div>
            <div class="admin-panel__top-actions">
              <button class="btn btn--primary" type="button" data-admin-add>Add brand</button>
              <button class="btn btn--ghost" type="button" data-admin-logout>Lock</button>
            </div>
          </div>

          <div class="admin-list" data-admin-list></div>

          <div class="admin-panel__actions">
            <button class="btn btn--primary" type="button" data-admin-save>Save all changes</button>
            <p class="admin-status" data-admin-save-status hidden></p>
          </div>
        </section>
      </div>
    </main>

    <script src="./shop-config.js"></script>
    <script src="./products-stock.js"></script>
    <script>
      (function () {
        var SESSION_KEY = "snuz_admin_ok";
        var loginView = document.querySelector("[data-admin-login]");
        var panelView = document.querySelector("[data-admin-panel]");
        var loginForm = document.querySelector("[data-admin-login-form]");
        var loginStatus = document.querySelector("[data-admin-login-status]");
        var sourceEl = document.querySelector("[data-admin-source]");
        var listEl = document.querySelector("[data-admin-list]");
        var saveBtn = document.querySelector("[data-admin-save]");
        var saveStatus = document.querySelector("[data-admin-save-status]");
        var logoutBtn = document.querySelector("[data-admin-logout]");
        var addBtn = document.querySelector("[data-admin-add]");
        var draft = [];

        function showStatus(el, message, isError) {
          if (!el) return;
          el.hidden = !message;
          el.textContent = message || "";
          el.classList.toggle("is-error", !!isError);
        }

        function isUnlocked() {
          try {
            return sessionStorage.getItem(SESSION_KEY) === "1";
          } catch (e) {
            return false;
          }
        }

        function setUnlocked(on) {
          try {
            if (on) sessionStorage.setItem(SESSION_KEY, "1");
            else sessionStorage.removeItem(SESSION_KEY);
          } catch (e) {}
        }

        function escapeHtml(value) {
          return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        function flavourRowHtml(variant) {
          var item = window.SnuzStock.normalizeVariant(variant || {}, {
            flavour: "",
            mg: 0,
            priceNaira: 9500,
            available: true,
            imageUrl: "",
          });
          var on = item.available !== false;
          var mgValue = item.mg > 0 ? String(item.mg) : "";
          var flavourImg = escapeHtml(item.imageUrl || "");
          return (
            '<div class="admin-flavour" data-variant-row>' +
            '<div class="admin-flavour__preview" data-flavour-preview>' +
            (flavourImg
              ? '<img src="' + flavourImg + '" alt="" width="56" height="56" />'
              : '<div class="admin-product__placeholder">No photo</div>') +
            "</div>" +
            '<label class="admin-field"><span>Flavour</span>' +
            '<input name="flavour" type="text" value="' +
            escapeHtml(item.flavour) +
            '" placeholder="Blue Mint" /></label>' +
            '<label class="admin-field"><span>mg</span>' +
            '<input name="mg" type="number" min="0" step="1" value="' +
            escapeHtml(mgValue) +
            '" placeholder="15" /></label>' +
            '<label class="admin-field"><span>Price (₦)</span>' +
            '<input name="price" type="number" min="0" step="1" value="' +
            escapeHtml(String(item.priceNaira)) +
            '" /></label>' +
            '<label class="admin-field admin-flavour__url"><span>Flavour photo URL</span>' +
            '<input name="flavourImage" type="text" value="' +
            flavourImg +
            '" placeholder="Upload or paste a link" /></label>' +
            '<div class="admin-flavour__photo">' +
            '<label class="btn btn--ghost admin-upload-btn">' +
            "Upload flavour photo" +
            '<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden data-flavour-upload />' +
            "</label>" +
            '<span class="admin-upload-status" data-flavour-upload-status hidden></span>' +
            "</div>" +
            '<div class="admin-flavour__stock">' +
            '<div class="admin-toggle" role="group" aria-label="Flavour stock">' +
            '<button type="button" class="admin-toggle__btn' +
            (on ? " is-on" : "") +
            '" data-variant-set="1">In stock</button>' +
            '<button type="button" class="admin-toggle__btn' +
            (!on ? " is-on is-sold" : "") +
            '" data-variant-set="0">Sold out</button>' +
            "</div>" +
            '<button type="button" class="btn btn--ghost admin-flavour__remove" data-remove-flavour>Remove</button>' +
            "</div>" +
            "</div>"
          );
        }

        function collectVariants(row) {
          return Array.from(row.querySelectorAll("[data-variant-row]"))
            .map(function (line) {
              return window.SnuzStock.normalizeVariant(
                {
                  flavour: (line.querySelector('[name="flavour"]') || {}).value || "",
                  mg: (line.querySelector('[name="mg"]') || {}).value || "0",
                  priceNaira: (line.querySelector('[name="price"]') || {}).value || "0",
                  available: line.querySelector('[data-variant-set].is-on[data-variant-set="1"]') != null,
                  imageUrl: (line.querySelector('[name="flavourImage"]') || {}).value || "",
                },
                { flavour: "", mg: 0, priceNaira: 0, available: true, imageUrl: "" }
              );
            })
            .filter(function (item) {
              return item.flavour;
            });
        }

        function collectFromDom() {
          var rows = Array.from(listEl.querySelectorAll("[data-admin-row]"));
          return rows.map(function (row, index) {
            var slug = row.getAttribute("data-slug") || "";
            var brand = (row.querySelector('[name="brand"]') || {}).value || "";
            var title = (row.querySelector('[name="title"]') || {}).value || "";
            var imageUrl = (row.querySelector('[name="imageUrl"]') || {}).value || "";
            var available = row.querySelector('[data-set].is-on[data-set="1"]') != null;
            var variants = collectVariants(row);
            var first = variants[0];
            return window.SnuzStock.normalizeProduct(
              {
                slug: slug,
                brand: brand,
                title: title || (first && first.flavour) || brand,
                priceNaira: first ? first.priceNaira : 0,
                imageUrl: imageUrl,
                available: available,
                sortOrder: (index + 1) * 10,
                variants: variants,
              },
              index
            );
          });
        }

        function renderList(list) {
          draft = window.SnuzStock.normalizeList(list);
          listEl.innerHTML = draft
            .map(function (product) {
              var available = product.available !== false;
              var img = escapeHtml(product.imageUrl || "");
              var variants = product.variants && product.variants.length ? product.variants : [{ flavour: "", mg: 0, priceNaira: product.priceNaira, available: true }];
              return (
                '<article class="admin-product" data-admin-row data-slug="' +
                escapeHtml(product.slug) +
                '">' +
                '<div class="admin-product__preview">' +
                (img
                  ? '<img src="' + img + '" alt="" width="88" height="88" />'
                  : '<div class="admin-product__placeholder">No photo</div>') +
                "</div>" +
                '<div class="admin-product__fields">' +
                '<label class="admin-field"><span>Brand</span>' +
                '<input name="brand" type="text" value="' +
                escapeHtml(product.brand) +
                '" required /></label>' +
                '<label class="admin-field"><span>Display name</span>' +
                '<input name="title" type="text" value="' +
                escapeHtml(product.title) +
                '" required /></label>' +
                '<label class="admin-field"><span>Photo URL</span>' +
                '<input name="imageUrl" type="text" value="' +
                img +
                '" placeholder="Upload below or paste a link" /></label>' +
                '<div class="admin-product__photo">' +
                '<label class="btn btn--ghost admin-upload-btn">' +
                "Upload photo" +
                '<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden data-upload />' +
                "</label>" +
                '<span class="admin-upload-status" data-upload-status hidden></span>' +
                "</div>" +
                '<div class="admin-product__stock">' +
                '<div class="admin-toggle" role="group" aria-label="Brand stock for ' +
                escapeHtml(product.brand) +
                '">' +
                '<button type="button" class="admin-toggle__btn' +
                (available ? " is-on" : "") +
                '" data-set="1">Brand in stock</button>' +
                '<button type="button" class="admin-toggle__btn' +
                (!available ? " is-on is-sold" : "") +
                '" data-set="0">Brand sold out</button>' +
                "</div>" +
                '<button type="button" class="btn btn--ghost admin-product__remove" data-remove>Remove brand</button>' +
                "</div>" +
                '<div class="admin-flavours">' +
                '<div class="admin-flavours__head">' +
                "<p>Flavours</p>" +
                '<button class="btn btn--ghost" type="button" data-add-flavour>Add flavour</button>' +
                "</div>" +
                '<div class="admin-flavours__list" data-flavour-list>' +
                variants.map(flavourRowHtml).join("") +
                "</div>" +
                "</div>" +
                "</div>" +
                "</article>"
              );
            })
            .join("");
        }

        function sourceLabel(source, error) {
          if (source === "supabase") return "Live catalog (Supabase) — changes sync for all shoppers.";
          if (source === "local" || source === "local-fallback") {
            return error
              ? "Browser-only catalog (live save unavailable). " + error
              : "Browser-only catalog — add Supabase keys for live site-wide updates.";
          }
          return "Default catalog. Change and save to store.";
        }

        async function openPanel() {
          loginView.hidden = true;
          panelView.hidden = false;
          showStatus(saveStatus, "");
          sourceEl.textContent = "Loading products…";
          var result = await window.SnuzStock.loadProducts();
          renderList(result.list);
          sourceEl.textContent = sourceLabel(result.source, result.error);
        }

        function showLogin() {
          setUnlocked(false);
          panelView.hidden = true;
          loginView.hidden = false;
        }

        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          var password = new FormData(loginForm).get("password");
          var configured = String((window.SNUZ_SHOP && window.SNUZ_SHOP.adminPassword) || "").trim();
          if (!window.SnuzStock.checkAdminPassword(password)) {
            var host = String(location.hostname || "");
            var hint =
              !configured && host !== "localhost" && host !== "127.0.0.1"
                ? " Local password only loads on http://localhost:5173 (not the live site, and not a file:// link)."
                : configured
                  ? " Use the exact adminPassword from shop-config.local.js, then hard-refresh (Cmd+Shift+R)."
                  : "";
            showStatus(loginStatus, "Wrong password." + hint, true);
            return;
          }
          if (!configured) {
            showStatus(
              loginStatus,
              "No admin password configured — unlocked for local demo. Set adminPassword in shop-config.local.js for a real lock.",
              false
            );
          } else {
            showStatus(loginStatus, "");
          }
          setUnlocked(true);
          openPanel();
        });

        logoutBtn.addEventListener("click", showLogin);

        addBtn.addEventListener("click", function () {
          draft = collectFromDom();
          var n = draft.length + 1;
          draft.push(
            window.SnuzStock.normalizeProduct(
              {
                slug: "product-" + Date.now(),
                brand: "NEW",
                title: "New brand",
                priceNaira: 9500,
                imageUrl: "",
                available: true,
                sortOrder: n * 10,
                variants: [{ flavour: "New flavour", mg: 15, priceNaira: 9500, available: true }],
              },
              n - 1
            )
          );
          renderList(draft);
          var last = listEl.querySelector("[data-admin-row]:last-child");
          if (last) last.scrollIntoView({ behavior: "smooth", block: "center" });
        });

        listEl.addEventListener("click", function (e) {
          var addFlavour = e.target.closest("[data-add-flavour]");
          if (addFlavour) {
            var flavourList = addFlavour.closest("[data-admin-row]");
            var list = flavourList && flavourList.querySelector("[data-flavour-list]");
            if (!list) return;
            list.insertAdjacentHTML(
              "beforeend",
              flavourRowHtml({ flavour: "", mg: 15, priceNaira: 9500, available: true })
            );
            return;
          }

          var removeFlavour = e.target.closest("[data-remove-flavour]");
          if (removeFlavour) {
            var flavourRow = removeFlavour.closest("[data-variant-row]");
            var parentList = removeFlavour.closest("[data-flavour-list]");
            if (!flavourRow || !parentList) return;
            if (parentList.querySelectorAll("[data-variant-row]").length < 2) {
              alert("Keep at least one flavour row.");
              return;
            }
            flavourRow.remove();
            return;
          }

          var removeBtn = e.target.closest("[data-remove]");
          if (removeBtn) {
            var removeRow = removeBtn.closest("[data-admin-row]");
            if (!removeRow) return;
            if (!confirm("Remove this brand from the shop?")) return;
            removeRow.remove();
            return;
          }

          var variantBtn = e.target.closest("[data-variant-set]");
          if (variantBtn) {
            var variantRow = variantBtn.closest("[data-variant-row]");
            if (!variantRow) return;
            var variantOn = variantBtn.getAttribute("data-variant-set") === "1";
            variantRow.querySelectorAll("[data-variant-set]").forEach(function (b) {
              var on = b.getAttribute("data-variant-set") === (variantOn ? "1" : "0");
              b.classList.toggle("is-on", on);
              b.classList.toggle("is-sold", on && !variantOn);
            });
            return;
          }

          var btn = e.target.closest("[data-set]");
          if (!btn) return;
          var row = btn.closest("[data-admin-row]");
          if (!row) return;
          var available = btn.getAttribute("data-set") === "1";
          row.querySelectorAll("[data-set]").forEach(function (b) {
            var on = b.getAttribute("data-set") === (available ? "1" : "0");
            b.classList.toggle("is-on", on);
            b.classList.toggle("is-sold", on && !available);
          });
        });

        listEl.addEventListener("change", async function (e) {
          var flavourInput = e.target.closest("[data-flavour-upload]");
          var input = flavourInput || e.target.closest("[data-upload]");
          if (!input || !input.files || !input.files[0]) return;
          var flavourRow = input.closest("[data-variant-row]");
          var row = input.closest("[data-admin-row]");
          if (!row) return;
          var status = flavourRow
            ? flavourRow.querySelector("[data-flavour-upload-status]")
            : row.querySelector("[data-upload-status]");
          var urlInput = flavourRow
            ? flavourRow.querySelector('[name="flavourImage"]')
            : row.querySelector('[name="imageUrl"]');
          var preview = flavourRow
            ? flavourRow.querySelector("[data-flavour-preview]")
            : row.querySelector(".admin-product__preview");
          var file = input.files[0];
          var slugHint =
            (row.querySelector('[name="brand"]') || {}).value ||
            row.getAttribute("data-slug") ||
            "product";
          if (flavourRow) {
            slugHint =
              slugHint +
              "-" +
              ((flavourRow.querySelector('[name="flavour"]') || {}).value || "flavour");
          }
          showStatus(status, "Uploading…", false);
          try {
            var url = await window.SnuzStock.uploadImage(file, slugHint);
            if (urlInput) urlInput.value = url;
            if (preview) {
              preview.innerHTML =
                '<img src="' + escapeHtml(url) + '" alt="" width="88" height="88" />';
            }
            showStatus(status, "Photo ready. Click Save all changes.", false);
          } catch (err) {
            showStatus(status, err.message || "Upload failed.", true);
          } finally {
            input.value = "";
          }
        });

        listEl.addEventListener("input", function (e) {
          var flavourUrl = e.target.closest('[name="flavourImage"]');
          if (flavourUrl) {
            var flavourRow = flavourUrl.closest("[data-variant-row]");
            var flavourPreview = flavourRow && flavourRow.querySelector("[data-flavour-preview]");
            if (!flavourPreview) return;
            var flavourSrc = flavourUrl.value.trim();
            flavourPreview.innerHTML = flavourSrc
              ? '<img src="' + escapeHtml(flavourSrc) + '" alt="" width="56" height="56" />'
              : '<div class="admin-product__placeholder">No photo</div>';
            return;
          }
          var urlInput = e.target.closest('[name="imageUrl"]');
          if (!urlInput) return;
          var row = urlInput.closest("[data-admin-row]");
          if (!row) return;
          var preview = row.querySelector(".admin-product__preview");
          if (!preview) return;
          var url = urlInput.value.trim();
          preview.innerHTML = url
            ? '<img src="' + escapeHtml(url) + '" alt="" width="88" height="88" />'
            : '<div class="admin-product__placeholder">No photo</div>';
        });

        saveBtn.addEventListener("click", async function () {
          saveBtn.disabled = true;
          saveBtn.textContent = "Saving…";
          showStatus(saveStatus, "");
          try {
            draft = collectFromDom();
            if (!draft.length) {
              throw new Error("Add at least one product before saving.");
            }
            var bad = draft.find(function (p) {
              return !p.brand.trim();
            });
            if (bad) throw new Error("Every collection needs a brand name.");
            var noFlavour = draft.find(function (p) {
              return !p.variants || !p.variants.length;
            });
            if (noFlavour) throw new Error("Every brand needs at least one flavour with a name.");
            var clash = draft.find(function (p) {
              var seen = {};
              return (p.variants || []).some(function (v) {
                var key = String(v.flavour).toLowerCase() + "|" + String(v.mg);
                if (seen[key]) return true;
                seen[key] = true;
                return false;
              });
            });
            if (clash) {
              throw new Error(
                "A brand has the same flavour and mg twice. Change one, or remove the extra row."
              );
            }
            // Stable slugs: keep existing; for new rows derive from brand+title once
            draft = draft.map(function (p, i) {
              var looksTemp = /^product-\d+$/.test(p.slug);
              if (looksTemp) {
                var nextSlug =
                  window.SnuzStock.slugify(p.brand + "-" + p.title) ||
                  window.SnuzStock.slugify(p.title) ||
                  window.SnuzStock.slugify(p.brand) ||
                  p.slug;
                return window.SnuzStock.normalizeProduct(
                  Object.assign({}, p, { slug: nextSlug }),
                  i
                );
              }
              return p;
            });
            draft = window.SnuzStock.ensureUniqueSlugs(draft);
            var result = await window.SnuzStock.saveProducts(draft);
            renderList(result.list);
            sourceEl.textContent = sourceLabel(result.source);
            showStatus(
              saveStatus,
              result.source === "supabase"
                ? window.SnuzStock.hasVariantsColumn()
                  ? "Saved. Shoppers will see this on the next page load."
                  : "Saved brands, but flavour rows need a one-time Supabase update. Run scripts/products-variants.sql, then save again."
                : "Saved in this browser only. Add Supabase for live site-wide products.",
              false
            );
          } catch (err) {
            showStatus(saveStatus, err.message || "Could not save products.", true);
          } finally {
            saveBtn.disabled = false;
            saveBtn.textContent = "Save all changes";
          }
        });

        if (isUnlocked()) openPanel();
      })();
    </script>
  </body>
</html>
